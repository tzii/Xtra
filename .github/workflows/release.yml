name: Release

on:
  workflow_dispatch:
    inputs:
      expected_rc_sha:
        description: Exact post-merge master commit to verify
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build_signed_rc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert dispatch target
        env:
          EXPECTED_RC_SHA: ${{ inputs.expected_rc_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_RC_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected RC SHA is not 40 lowercase hex characters" >&2
            exit 1
          fi
          if [[ "$DISPATCH_REF" != "refs/heads/master" ]]; then
            echo "release candidates must be dispatched on master" >&2
            exit 1
          fi
          if [[ "$EXPECTED_RC_SHA" != "$DISPATCH_SHA" ]]; then
            echo "expected RC SHA does not match the dispatched commit" >&2
            exit 1
          fi

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Read and validate version metadata
        id: version
        run: |
          set -euo pipefail
          node scripts/release/release-metadata.mjs version app/build.gradle.kts > version.json
          VERSION_NAME="$(node -p 'JSON.parse(require("node:fs").readFileSync("version.json", "utf8")).versionName')"
          VERSION_CODE="$(node -p 'JSON.parse(require("node:fs").readFileSync("version.json", "utf8")).versionCode')"
          NOTES_FILE="docs/release-notes/${VERSION_NAME}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "release notes are missing: $NOTES_FILE" >&2
            exit 1
          fi
          node scripts/release/release-metadata.mjs notes "$NOTES_FILE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and lint
        run: ./gradlew test lintDebug --no-daemon --console=plain

      - name: Decode release keystore and build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cleanup() { rm -f app/release-keystore.jks; }
          trap cleanup EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          ./gradlew assembleRelease --no-daemon --console=plain
          cleanup
          trap - EXIT

      - name: Remove keystore
        if: always()
        run: rm -f app/release-keystore.jks

      - name: Rename and verify APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          APK_PATH: release-bundle/ThystTV-${{ steps.version.outputs.version_name }}.apk
          EXPECTED_PACKAGE_ID: com.tzii.thysttv
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_CERT_SHA256: ""
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | sort | head -n 1)"
          apk_count="$(find app/build/outputs/apk/release -name '*.apk' -type f | wc -l)"
          if [[ "$apk_count" != "1" ]]; then
            echo "expected exactly one release APK" >&2
            exit 1
          fi
          mv "$apk" "$APK_PATH"
          EXPECTED_CERT_SHA256="$(tr -d '[:space:]' < scripts/release/official-signing-certificate.sha256)"
          export EXPECTED_CERT_SHA256
          bash scripts/release/verify-apk.sh > apk-evidence.txt
          cat apk-evidence.txt

      - name: Write APK checksum
        working-directory: release-bundle
        run: |
          set -euo pipefail
          sha256sum "ThystTV-${{ steps.version.outputs.version_name }}.apk" > "ThystTV-${{ steps.version.outputs.version_name }}.apk.sha256"
          sha256sum --check "ThystTV-${{ steps.version.outputs.version_name }}.apk.sha256"

      - name: Create RC manifest
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          apk_sha256="$(sha256sum "release-bundle/ThystTV-${{ steps.version.outputs.version_name }}.apk" | awk '{print $1}')"
          certificate_sha256="$(tr -d '[:space:]' < scripts/release/official-signing-certificate.sha256)"
          cat > rc-fields.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "release.yml",
            "runId": ${{ github.run_id }},
            "rcSha": "${{ github.sha }}",
            "versionName": "${{ steps.version.outputs.version_name }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "packageId": "com.tzii.thysttv",
            "apkFilename": "ThystTV-${{ steps.version.outputs.version_name }}.apk",
            "apkSha256": "$apk_sha256",
            "certificateSha256": "$certificate_sha256"
          }
          EOF
          node scripts/release/release-metadata.mjs manifest rc-fields.json release-bundle/rc-manifest.json

      - name: Write RC manifest checksum
        working-directory: release-bundle
        run: |
          set -euo pipefail
          sha256sum rc-manifest.json > rc-manifest.json.sha256
          sha256sum --check rc-manifest.json.sha256

      - name: Upload RC bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.sha }}-${{ github.run_id }}
          path: |
            release-bundle/ThystTV-${{ steps.version.outputs.version_name }}.apk
            release-bundle/ThystTV-${{ steps.version.outputs.version_name }}.apk.sha256
            release-bundle/rc-manifest.json
            release-bundle/rc-manifest.json.sha256
          overwrite: false
          retention-days: 90

      - name: Write workflow summary
        run: |
          set -euo pipefail
          {
            echo "## ThystTV signed RC"
            echo "- RC SHA: \`${{ github.sha }}\`"
            echo "- Workflow run: \`${{ github.run_id }}\`"
            echo "- Artifact: \`${{ github.sha }}-${{ github.run_id }}\`"
            echo "- Package: \`com.tzii.thysttv\`"
            echo "- Version: \`${{ steps.version.outputs.version_name }}\` (code ${{ steps.version.outputs.version_code }})"
            echo "- APK SHA-256: \`$(sha256sum release-bundle/ThystTV-${{ steps.version.outputs.version_name }}.apk | awk '{print $1}')\`"
            echo "- Manifest SHA-256: \`$(sha256sum release-bundle/rc-manifest.json | awk '{print $1}')\`"
            echo "- Certificate SHA-256: \`$(tr -d '[:space:]' < scripts/release/official-signing-certificate.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify_release_tag:
    name: Verify tagged candidate (maintainer publishes)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout sources at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate tag actor and parse RC bindings
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.actor }}" != "tzii" ]]; then
            echo "only tzii may publish release tags; actor was ${{ github.actor }}" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "release tags must be annotated tag objects" >&2
            exit 1
          fi
          # The annotated tag message must bind exactly one approved RC:
          #   RC-Workflow-Run: <run id>
          #   RC-Manifest-SHA256: <64 lowercase hex characters>
          git cat-file tag "$GITHUB_REF_NAME" > tag-message.txt
          peeled_sha="$(git rev-parse "$GITHUB_REF_NAME^{}")"
          echo "peeled_sha=$peeled_sha" >> "$GITHUB_OUTPUT"
          node scripts/release/release-metadata.mjs tag tag-message.txt > tag-fields.json
          run_id="$(node -p 'JSON.parse(require("node:fs").readFileSync("tag-fields.json", "utf8")).runId')"
          manifest_sha256="$(node -p 'JSON.parse(require("node:fs").readFileSync("tag-fields.json", "utf8")).manifestSha256')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Validate version and release notes
        id: version
        run: |
          set -euo pipefail
          node scripts/release/release-metadata.mjs version app/build.gradle.kts > version.json
          VERSION_NAME="$(node -p 'JSON.parse(require("node:fs").readFileSync("version.json", "utf8")).versionName')"
          VERSION_CODE="$(node -p 'JSON.parse(require("node:fs").readFileSync("version.json", "utf8")).versionCode')"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match source version v$VERSION_NAME" >&2
            exit 1
          fi
          NOTES_FILE="docs/release-notes/${VERSION_NAME}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "release notes are missing: $NOTES_FILE" >&2
            exit 1
          fi
          node scripts/release/release-metadata.mjs notes "$NOTES_FILE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Validate the RC workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ steps.tag.outputs.run_id }}" \
            --jq '{id: .id, event: .event, conclusion: .conclusion, head_sha: .head_sha, path: .path}' > run.json
          printf '{"runId": %s, "rcSha": "%s"}\n' "${{ steps.tag.outputs.run_id }}" "${{ steps.tag.outputs.peeled_sha }}" > run-expected.json
          node scripts/release/release-metadata.mjs run run.json run-expected.json

      - name: Download approved RC bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.tag.outputs.peeled_sha }}-${{ steps.tag.outputs.run_id }}
          path: release-bundle
          run-id: ${{ steps.tag.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Verify manifest digest
        run: |
          set -euo pipefail
          file_count="$(find release-bundle -maxdepth 1 -type f | wc -l)"
          if [[ "$file_count" != "4" ]]; then
            echo "expected exactly four files in the RC bundle, found $file_count" >&2
            exit 1
          fi
          actual_manifest_sha256="$(sha256sum release-bundle/rc-manifest.json | awk '{print $1}')"
          if [[ "$actual_manifest_sha256" != "${{ steps.tag.outputs.manifest_sha256 }}" ]]; then
            echo "manifest digest does not match the tag binding" >&2
            exit 1
          fi
          (cd release-bundle && sha256sum --check rc-manifest.json.sha256)

      - name: Verify APK and promotion binding
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          APK_PATH: release-bundle/ThystTV-${{ steps.version.outputs.version_name }}.apk
          EXPECTED_PACKAGE_ID: com.tzii.thysttv
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_CERT_SHA256: ""
        run: |
          set -euo pipefail
          (cd release-bundle && sha256sum --check "ThystTV-${{ steps.version.outputs.version_name }}.apk.sha256")
          EXPECTED_CERT_SHA256="$(tr -d '[:space:]' < scripts/release/official-signing-certificate.sha256)"
          export EXPECTED_CERT_SHA256
          bash scripts/release/verify-apk.sh > apk-evidence.txt
          cat apk-evidence.txt
          apk_sha256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          cat > promotion-expected.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "release.yml",
            "runId": ${{ steps.tag.outputs.run_id }},
            "rcSha": "${{ steps.tag.outputs.peeled_sha }}",
            "versionName": "${{ steps.version.outputs.version_name }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "packageId": "com.tzii.thysttv",
            "apkFilename": "ThystTV-${{ steps.version.outputs.version_name }}.apk",
            "apkSha256": "$apk_sha256",
            "certificateSha256": "$EXPECTED_CERT_SHA256"
          }
          EOF
          node scripts/release/release-metadata.mjs promotion release-bundle/rc-manifest.json promotion-expected.json

      # GITHUB_TOKEN cannot see ruleset bypass actors. Full policy checks and
      # publication run through the maintainer CLI; no privileged token is stored here.
      - name: Write maintainer publication handoff
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          {
            echo "## Signed candidate verified; maintainer publication required"
            echo "This job has not published a release or verified the full ruleset authority."
            echo "- Tag: \`$GITHUB_REF_NAME\`"
            echo "- Verified APK SHA-256: \`$(sha256sum release-bundle/ThystTV-${VERSION_NAME}.apk | awk '{print $1}')\`"
            echo "- Source SHA: \`${{ steps.tag.outputs.peeled_sha }}\`"
            echo "- RC workflow run: \`${{ steps.tag.outputs.run_id }}\`"
            echo "- Certificate SHA-256: \`$(tr -d '[:space:]' < scripts/release/official-signing-certificate.sha256)\`"
            echo ""
            echo "After the required reviews and device QA, run from a trusted checkout with maintainer gh authentication:"
            echo "\`node scripts/release/publish-release.mjs v${VERSION_NAME} --publish\`"
            echo "The CLI validates full tag policies and exact RC bytes before publication, then verifies public downloads."
          } >> "$GITHUB_STEP_SUMMARY"
