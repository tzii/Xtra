name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Run repository contract tests
        run: |
          node --test docs/site.test.js .github/workflows/release.test.mjs scripts/release/*.test.mjs
          python3 scripts/check-updater-contracts.py
          bash -n scripts/release/verify-apk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -keystore app/debug-keystore.jks \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug
        run: ./gradlew assembleDebug

      - name: Verify structured APK signer integration
        run: |
          set -euo pipefail
          apksigner_jar="$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)"
          signer_digest="$(java --class-path "$apksigner_jar" --source 21 scripts/release/VerifyApkSigner.java app/build/outputs/apk/debug/app-debug.apk)"
          if [[ ! "$signer_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "structured APK signer did not return one SHA-256 digest" >&2
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew test

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports
          path: |
            app/build/reports/
            app/build/test-results/
