query SearchChannels($query: String!, $first: Int, $after: Cursor) {
    searchUsers(userQuery: $query, first: $first, after: $after) {
        edges {
            cursor
            node {
                displayName
                followers {
                    totalCount
                }
                id
                login
                profileImageURL(width: 300)
                stream {
                    createdAt
                    game {
                        displayName
                    }
                    id
                    previewImageURL
                    title
                    viewersCount
                }
            }
        }
        pageInfo {
            hasNextPage
        }
    }
}
